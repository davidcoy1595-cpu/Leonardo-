<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Universo 💖</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial, sans-serif;
}

canvas{
  position:absolute;
  top:0;
  left:0;
}

#ytBox{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
}

input{
  padding:8px;
  border-radius:20px;
  border:none;
  width:180px;
}

button{
  padding:8px 15px;
  border-radius:20px;
  border:none;
  background:#ff3d9a;
  color:white;
  margin-left:5px;
}

iframe{
  margin-top:10px;
  border-radius:15px;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="ytBox">
  <input type="text" id="ytLink" placeholder="Link YouTube">
  <button onclick="loadYT()">Reproducir 🎵</button>
  <div id="player"></div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];
let texts = [];

let phrases = [
"Perdóname mi amor 🥺",
"Eres tú, eres lo mejor 💖",
"No quiero perderte 😔",
"Mereces el universo entero ✨",
"Mi reyna 👑",
"Mi perla 🤍",
"Mi amor ❤️",
"Mi negra hermosa 💕",
"Mi bb 🥰",
"Mi goldita 😊",
"Te amo infinito 💞"
];

// Estrellas suaves
for(let i=0;i<400;i++){
  stars.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    size:Math.random()*2
  });
}

// Textos distribuidos bien
for(let i=0;i<1500;i++){
  texts.push({
    text:phrases[Math.floor(Math.random()*phrases.length)],
    x:(Math.random()-0.5)*4000,
    y:(Math.random()-0.5)*4000,
    size:Math.random()*14+10
  });
}

let scale = 1;
let offsetX = 0;
let offsetY = 0;

function draw(){

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // estrellas
  ctx.fillStyle="white";
  stars.forEach(s=>{
    ctx.fillRect(s.x,s.y,s.size,s.size);
  });

  // planeta bonito
  let gradient = ctx.createRadialGradient(
    canvas.width/2+offsetX,
    canvas.height/2+offsetY,
    50,
    canvas.width/2+offsetX,
    canvas.height/2+offsetY,
    200
  );

  gradient.addColorStop(0,"#ff6ec7");
  gradient.addColorStop(1,"#6a00ff");

  ctx.beginPath();
  ctx.fillStyle=gradient;
  ctx.arc(canvas.width/2+offsetX,canvas.height/2+offsetY,120*scale,0,Math.PI*2);
  ctx.fill();

  // transformar para textos
  ctx.setTransform(scale,0,0,scale,
    canvas.width/2+offsetX,
    canvas.height/2+offsetY);

  ctx.fillStyle="white";

  texts.forEach(t=>{
    ctx.font = t.size+"px Arial";
    ctx.fillText(t.text,t.x,t.y);
  });

  requestAnimationFrame(draw);
}

draw();

// mover
let dragging=false;
let lastX,lastY;

canvas.addEventListener("touchstart",e=>{
  if(e.touches.length==1){
    dragging=true;
    lastX=e.touches[0].clientX;
    lastY=e.touches[0].clientY;
  }
});

canvas.addEventListener("touchmove",e=>{
  if(dragging && e.touches.length==1){
    offsetX+=e.touches[0].clientX-lastX;
    offsetY+=e.touches[0].clientY-lastY;
    lastX=e.touches[0].clientX;
    lastY=e.touches[0].clientY;
  }

  if(e.touches.length==2){
    let dx=e.touches[0].clientX-e.touches[1].clientX;
    let dy=e.touches[0].clientY-e.touches[1].clientY;
    let dist=Math.sqrt(dx*dx+dy*dy);
    scale=dist/200;
    scale=Math.min(Math.max(0.5,scale),3);
  }
});

canvas.addEventListener("touchend",()=>dragging=false);

// YouTube
function loadYT(){
  let link=document.getElementById("ytLink").value;
  if(!link) return;

  let videoID="";
  if(link.includes("watch?v=")){
    videoID=link.split("watch?v=")[1].split("&")[0];
  }else if(link.includes("youtu.be/")){
    videoID=link.split("youtu.be/")[1].split("?")[0];
  }

  document.getElementById("player").innerHTML=
  `<iframe width="300" height="200"
  src="https://www.youtube.com/embed/${videoID}?autoplay=1"
  allow="autoplay"
  allowfullscreen></iframe>`;
}
</script>

</body>
</html>
