<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Universo Infinito 💖</title>

<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
  font-family:Arial, sans-serif;
}

canvas{
  position:absolute;
  top:0;
  left:0;
}

#ytContainer{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
}

input{
  padding:8px;
  border-radius:20px;
  border:none;
  width:200px;
}

button{
  padding:8px 15px;
  border-radius:20px;
  border:none;
  background:#ff3d9a;
  color:white;
  margin-left:5px;
}

iframe{
  margin-top:10px;
  border-radius:15px;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="ytContainer">
  <input type="text" id="ytLink" placeholder="Pega link de YouTube">
  <button onclick="loadYT()">Reproducir 🎵</button>
  <div id="player"></div>
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let scale = 1;
let offsetX = 0;
let offsetY = 0;

let phrases = [
"Perdóname mi amor 🥺",
"Eres tú, eres lo mejor 💖",
"No quiero perderte 😔",
"Mereces el universo entero ✨",
"Mi reyna 👑",
"Mi perla 🤍",
"Mi amor ❤️",
"Mi negra hermosa 💕",
"Mi bb 🥰",
"Mi goldita 😊",
"Te amo infinito 💞"
];

let words = [];

// GENERA MILES Y MILES
for(let i=0;i<4000;i++){
  words.push({
    text: phrases[Math.floor(Math.random()*phrases.length)],
    x:(Math.random()-0.5)*8000,
    y:(Math.random()-0.5)*8000,
    size:Math.random()*14+10
  });
}

function draw(){
  ctx.setTransform(scale,0,0,scale,
    canvas.width/2+offsetX,
    canvas.height/2+offsetY);

  ctx.clearRect(-10000,-10000,20000,20000);

  ctx.fillStyle="white";

  words.forEach(w=>{
    ctx.font = w.size+"px Arial";
    ctx.fillText(w.text,w.x,w.y);
  });

  requestAnimationFrame(draw);
}

draw();

// MOVER CON DEDO
let dragging=false;
let lastX,lastY;

canvas.addEventListener("touchstart",e=>{
  if(e.touches.length==1){
    dragging=true;
    lastX=e.touches[0].clientX;
    lastY=e.touches[0].clientY;
  }
});

canvas.addEventListener("touchmove",e=>{
  if(dragging && e.touches.length==1){
    offsetX+=e.touches[0].clientX-lastX;
    offsetY+=e.touches[0].clientY-lastY;
    lastX=e.touches[0].clientX;
    lastY=e.touches[0].clientY;
  }

  if(e.touches.length==2){
    let dx=e.touches[0].clientX-e.touches[1].clientX;
    let dy=e.touches[0].clientY-e.touches[1].clientY;
    let dist=Math.sqrt(dx*dx+dy*dy);
    scale=dist/200;
    scale=Math.min(Math.max(0.5,scale),4);
  }
});

canvas.addEventListener("touchend",()=>dragging=false);

// YOUTUBE
function loadYT(){
  let link=document.getElementById("ytLink").value;
  if(!link) return;

  let videoID="";
  if(link.includes("watch?v=")){
    videoID=link.split("watch?v=")[1];
  }else if(link.includes("youtu.be/")){
    videoID=link.split("youtu.be/")[1];
  }

  document.getElementById("player").innerHTML=
  `<iframe width="300" height="200"
  src="https://www.youtube.com/embed/${videoID}?autoplay=1"
  allow="autoplay"
  allowfullscreen></iframe>`;
}
</script>

</body>
</html>
