<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mi Reyna 💖</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
    touch-action:none;
}

canvas{
    position:absolute;
    top:0;
    left:0;
}

#mensaje{
    position:absolute;
    width:100%;
    text-align:center;
    top:15%;
    color:white;
    font-size:18px;
    line-height:28px;
    padding:20px;
    pointer-events:none;
}

#musicBtn{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    padding:12px 20px;
    background:#ff4da6;
    color:white;
    border:none;
    border-radius:25px;
    font-size:16px;
}

input[type="file"]{
    display:none;
}
</style>
</head>

<body>

<div id="mensaje">
💖 Mi reyna mi perla mi amor mi negra hermosa mi bb mi goldita shititita ☺️<br><br>
Me perdonas amor? 🥺<br>
Eres tú, eres lo mejor.<br>
No quiero perderte.<br>
Mereces el universo entero. ✨
</div>

<button id="musicBtn">Elegir Música 🎵</button>
<input type="file" id="musicInput" accept="audio/*">

<canvas id="space"></canvas>

<script>
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let scale = 1;
let offsetX = 0;
let offsetY = 0;

let stars = [];
for(let i=0;i<200;i++){
    stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        size:Math.random()*2
    });
}

let angle = 0;

function draw(){
    ctx.setTransform(scale,0,0,scale,offsetX,offsetY);
    ctx.clearRect(-offsetX/scale,-offsetY/scale,canvas.width/scale,canvas.height/scale);

    // estrellas
    ctx.fillStyle="white";
    stars.forEach(s=>{
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
        ctx.fill();
    });

    // planeta principal
    ctx.beginPath();
    ctx.fillStyle="#3b82f6";
    ctx.arc(canvas.width/2,canvas.height/2,80,0,Math.PI*2);
    ctx.fill();

    // anillo
    ctx.save();
    ctx.translate(canvas.width/2,canvas.height/2);
    ctx.rotate(angle);
    ctx.strokeStyle="rgba(200,200,255,0.7)";
    ctx.lineWidth=6;
    ctx.beginPath();
    ctx.ellipse(0,0,120,40,0,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();

    // segundo planeta
    ctx.beginPath();
    ctx.fillStyle="#ff69b4";
    ctx.arc(canvas.width/2+250,canvas.height/2-150,40,0,Math.PI*2);
    ctx.fill();

    angle+=0.01;

    requestAnimationFrame(draw);
}

draw();

// mover galaxia
let isDragging=false;
let startX,startY;

canvas.addEventListener("touchstart",(e)=>{
    isDragging=true;
    startX=e.touches[0].clientX-offsetX;
    startY=e.touches[0].clientY-offsetY;
});

canvas.addEventListener("touchmove",(e)=>{
    if(isDragging){
        offsetX=e.touches[0].clientX-startX;
        offsetY=e.touches[0].clientY-startY;
    }
});

canvas.addEventListener("touchend",()=>isDragging=false);

// zoom con dos dedos
canvas.addEventListener("wheel",(e)=>{
    scale += e.deltaY * -0.001;
    scale=Math.min(Math.max(.5,scale),3);
});

// música desde celular
const musicBtn=document.getElementById("musicBtn");
const musicInput=document.getElementById("musicInput");
let audio;

musicBtn.onclick=()=>musicInput.click();

musicInput.onchange=(e)=>{
    const file=e.target.files[0];
    if(file){
        if(audio) audio.pause();
        audio=new Audio(URL.createObjectURL(file));
        audio.play();
    }
}
</script>

</body>
  </html>
